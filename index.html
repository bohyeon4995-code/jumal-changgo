<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="청주시 서원구 사창동 이웃의 캠핑·취미 장비를 빌리는 동네 공유 서비스">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>주말창고</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-shaped app column, with a demo-scenario rail beside it on wide screens */
:root{
  --bg:#E9EEE8; --surface:#FFFFFF; --sunken:#F3F6F2; --ink:#16231C; --muted:#5A6A60; --line:#D3DCD3;
  --pine:#1F5C43; --pine-ink:#FFFFFF; --pine-soft:#E0EDE4;
  --amber:#B87412; --amber-soft:#FBEFD8; --danger:#B03E2C; --danger-soft:#F8E4DF;
  --f-display:"Do Hyeon","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1410; --surface:#151F19; --sunken:#1B2720; --ink:#E4ECE6; --muted:#98A99E; --line:#2A3A31;
  --pine:#62BC8E; --pine-ink:#0A1A11; --pine-soft:#1B3427;
  --amber:#F0B04A; --amber-soft:#3A2B12; --danger:#EE7D68; --danger-soft:#3A1C16; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1410; --surface:#151F19; --sunken:#1B2720; --ink:#E4ECE6; --muted:#98A99E; --line:#2A3A31;
  --pine:#62BC8E; --pine-ink:#0A1A11; --pine-soft:#1B3427;
  --amber:#F0B04A; --amber-soft:#3A2B12; --danger:#EE7D68; --danger-soft:#3A1C16; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--pine);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

.stage{height:100%;display:flex;justify-content:center;background:var(--bg)}
.phone{position:relative;width:100%;max-width:480px;height:100%;display:flex;flex-direction:column;background:var(--surface);border-inline:1px solid var(--line);overflow:hidden}
@media (max-width:480px){ .phone{border:0} }
.h-title{font-size:20px;font-weight:700}

#top{display:flex;align-items:center;gap:10px;min-height:58px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.brand{font-family:var(--f-display);font-size:24px;letter-spacing:.5px;color:var(--pine);line-height:1}
.loc{margin-left:auto;display:flex;align-items:center;gap:4px;font-size:12.5px;color:var(--muted);white-space:nowrap;min-width:0;overflow:hidden}
.me{flex:none;width:28px;height:28px;border-radius:50%;object-fit:cover;border:1px solid var(--line)}
.iconbtn{display:grid;place-items:center;width:36px;height:36px;border:0;border-radius:10px;background:transparent;flex:none}
.iconbtn:hover{background:var(--sunken)}
.toptitle{font-weight:600;font-size:16px}

main#view{flex:1;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column}
.pad{padding:18px 16px 24px;display:flex;flex-direction:column;gap:22px}
.banner{margin:12px 16px 0;padding:10px 12px;border-radius:12px;font-size:13px;background:var(--amber-soft);color:var(--ink)}

#tabs{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom,0px)}
#tabs button{border:0;background:none;padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--muted)}
#tabs button[aria-current="page"]{color:var(--pine);font-weight:600}
#tabs svg{width:22px;height:22px}

.eyebrow{font-size:12px;letter-spacing:.06em;color:var(--amber);font-weight:600}
.h-display{font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1.2}
.h-sec{font-size:15px;font-weight:700;display:flex;align-items:baseline;gap:8px}
.h-sec small{font-weight:500;font-size:12px;color:var(--muted)}
.muted{color:var(--muted)}
.fine{font-size:12px;color:var(--muted)}
.sec{display:flex;flex-direction:column;gap:10px}
.stack{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}

.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.seg{display:inline-flex;background:var(--sunken);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:9px;padding:7px 14px;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg.small button{padding:4px 10px;font-size:12.5px}
.seg.full{display:flex}
.seg.full button{flex:1}

.cards{display:flex;flex-direction:column;gap:10px}
.card{width:100%;text-align:left;display:grid;grid-template-columns:88px 1fr;gap:14px;align-items:start;padding:12px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.card:hover{border-color:var(--pine)}
.card .body{min-width:0;display:flex;flex-direction:column;gap:3px}
.card .name{font-weight:700;font-size:15.5px;overflow-wrap:anywhere}
.card .meta{font-size:12.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap}
.card .items{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .price{margin-top:4px;display:flex;align-items:baseline;gap:4px;flex-wrap:wrap}
.price b{font-family:var(--f-num);font-size:16px;font-weight:600}
.price span{font-size:12px;color:var(--muted)}
.art{aspect-ratio:1/1;max-width:100%;border-radius:12px;display:grid;place-items:center;background:var(--pine-soft);color:var(--pine)}
.art.warm{background:var(--amber-soft);color:var(--amber)}
.art svg{width:72%;height:auto}
.art.hero{aspect-ratio:16/8;border-radius:18px}
.art.hero svg{width:44%}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.tag{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--sunken);color:var(--muted)}
.tag.pine{background:var(--pine-soft);color:var(--pine)}
.tag.amber{background:var(--amber-soft);color:var(--amber)}

.owner{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--sunken)}
.avatar{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--pine);color:var(--pine-ink);font-weight:700;object-fit:cover}
.owner .who{min-width:0;flex:1}
.owner .who b{display:block}
.owner .who span{font-size:12.5px;color:var(--muted)}
.list{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.list li{display:flex;justify-content:space-between;gap:12px;padding:11px 14px;font-size:14px}
.list li+li{border-top:1px solid var(--line)}
.list li span:first-child{min-width:0;overflow-wrap:anywhere}
.list li span:last-child{color:var(--muted);font-size:13px;text-align:right}
.linkcard{width:100%;text-align:left;display:flex;align-items:center;gap:12px;padding:13px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.linkcard:hover{border-color:var(--pine)}
.linkcard .t{flex:1;min-width:0}
.linkcard .t b{display:block;font-size:14px}
.linkcard .t span{font-size:12.5px;color:var(--muted)}

.ctabar{position:sticky;bottom:0;margin-top:auto;display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line);background:var(--surface)}
.ctabar .price{flex:none}
.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:700;font-size:15px;background:var(--pine);color:var(--pine-ink);flex:1;text-align:center}
.btn:hover:not(:disabled){filter:brightness(1.07)}
.btn:disabled{background:var(--line);color:var(--muted)}
.btn.ghost{background:var(--sunken);color:var(--ink)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px;flex:none}

.dates{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.date{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:1px}
.date b{font-family:var(--f-num);font-size:15px;font-weight:600}
.date small{font-size:11.5px;color:var(--muted)}
.date[aria-pressed="true"]{background:var(--pine);border-color:var(--pine);color:var(--pine-ink)}
.date[aria-pressed="true"] small{color:var(--pine-ink)}
.date:disabled{background:var(--sunken);color:var(--muted);border-style:dashed}
.date:disabled b{text-decoration:line-through;font-weight:500}
.date.off{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
.date.off small{color:var(--amber)}
.receipt{border:1px solid var(--line);border-radius:14px;padding:4px 14px;background:var(--sunken)}
.receipt div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;font-size:14px}
.receipt div+div{border-top:1px dashed var(--line)}
.receipt .total{font-weight:700;font-size:15.5px}
.receipt .num{font-weight:600}
.note{font-size:12.5px;color:var(--muted);padding:10px 12px;border-radius:12px;border:1px solid var(--line)}

.done{align-items:center;text-align:center;gap:6px;padding-top:30px}
.badge-ok{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--pine-soft);color:var(--pine);margin-bottom:6px}

.trip{width:100%;text-align:left;display:flex;flex-direction:column;gap:6px;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.trip:hover{border-color:var(--pine)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;flex:none}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.reserved{background:var(--amber-soft);color:var(--amber)}
.pill.inUse{background:var(--pine-soft);color:var(--pine)}
.pill.returned{background:var(--sunken);color:var(--muted)}
.empty{padding:32px 16px;text-align:center;border:1px dashed var(--line);border-radius:16px;display:flex;flex-direction:column;gap:10px;align-items:center}

.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.steps li{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted);text-align:center}
.steps li::before{content:"";height:4px;border-radius:2px;background:var(--line)}
.steps li.on{color:var(--pine);font-weight:600}
.steps li.on::before{background:var(--pine)}

.slots{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.slot{position:relative;aspect-ratio:4/3;max-width:100%;border-radius:12px;overflow:hidden;border:1.5px dashed var(--line);background:var(--sunken);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);font-size:13px;text-align:center;padding:6px}
label.slot{cursor:pointer}
label.slot:hover{border-color:var(--pine);color:var(--pine)}
.slot.filled{border:1px solid var(--line);padding:0}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.slot .cap{position:absolute;left:6px;bottom:6px;font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:6px;background:rgba(10,20,15,.68);color:#fff}
.slot .x{position:absolute;right:6px;top:6px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(10,20,15,.68);color:#fff;display:grid;place-items:center;font-size:15px;line-height:1}
.compare{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px 8px;align-items:center}
.compare .lab{font-size:12.5px;color:var(--muted);min-width:42px}
.compare .hd{font-size:12px;font-weight:600;color:var(--muted);text-align:center}
.thumb{display:block;width:100%;aspect-ratio:4/3;border-radius:8px;overflow:hidden;border:0;padding:0;background:var(--sunken);cursor:zoom-in}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{padding:12px;border-radius:14px;background:var(--sunken)}
.stat b{display:block;font-family:var(--f-num);font-size:20px;font-weight:600}
.stat span{font-size:12px;color:var(--muted)}
.timeline{display:flex;flex-direction:column;border-left:2px solid var(--line);margin-left:6px}
.entry{position:relative;padding:0 0 22px 18px;display:flex;flex-direction:column;gap:8px}
.entry::before{content:"";position:absolute;left:-7px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--pine)}
.entry .hd{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.entry .hd b{font-family:var(--f-num);font-weight:600}
.strip{display:grid;grid-template-columns:auto repeat(4,1fr);gap:5px;align-items:center}
.strip .lab{font-size:11.5px;color:var(--muted);padding-right:4px}

/* Forms */
.field{display:flex;flex-direction:column;gap:5px}
.field > span{font-size:13px;font-weight:600}
.input{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);min-width:0}
.input:focus{outline:2px solid var(--pine);outline-offset:-1px;border-color:transparent}
textarea.input{resize:vertical;min-height:70px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.itemrow{display:grid;grid-template-columns:1.6fr 1fr;gap:8px}
.check{display:flex;align-items:center;gap:8px;font-size:14px}
.check input{width:18px;height:18px;accent-color:var(--pine)}
.err{font-size:12.5px;color:var(--danger)}

.guide{display:none;width:280px;align-self:center;flex-direction:column;gap:16px}
@media (min-width:960px){.guide{display:flex}}
.guide .scn{font-size:13.5px;color:var(--muted)}
.gsteps{display:flex;flex-direction:column;gap:6px}
.gsteps li{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;padding:10px 12px;border-radius:12px;border:1px solid transparent;font-size:13.5px}
.gsteps li .n{font-family:var(--f-num);font-weight:600;color:var(--muted)}
.gsteps li small{display:block;font-size:12px;color:var(--muted)}
.gsteps li.on{background:var(--surface);border-color:var(--line)}
.gsteps li.on .n{color:var(--pine)}
.gsteps li.past{opacity:.6}

#lightbox{position:fixed;inset:0;z-index:20;background:rgba(5,10,8,.86);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px 16px}
#lightbox img{max-width:min(92vw,720px);max-height:76%;border-radius:12px}
#lightbox p{color:#fff;font-size:14px}
#lightbox button{border:0;border-radius:10px;padding:8px 16px;background:#fff;color:#111;font-weight:600}
#toast{position:fixed;left:50%;bottom:max(28px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;max-width:min(380px,calc(100vw - 32px));background:var(--ink);color:var(--surface);padding:11px 16px;border-radius:12px;font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.spin{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--pine)}
@media (prefers-reduced-motion:no-preference){
  .spin{animation:sp 0.9s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
}
</style>
</head>
<body>
<div class="stage">
  <div class="phone">
    <header id="top"></header>
    <main id="view"></main>
    <nav id="tabs" aria-label="주요 메뉴"></nav>
  </div>
</div>
<div id="lightbox" hidden></div>
<div id="toast" role="status" hidden></div>

<script>
(function(){
"use strict";
/* ---------- constants ---------- */
const CATS = [["all","전체"],["camp","캠핑 세트"],["light","조명"],["fire","화로"],["etc","기타"]];
const ARTOF = {camp:"tent", light:"lantern", fire:"fire", etc:"pack"};
const COACH_FEE = 10000;
const PAD_SLOTS = ["전체 모습","구성품","보관 가방","기타"];
const DISTS = [400,800,1200,1600,2000];
const ACTIVE = b => b.status==="reserved" || b.status==="inUse";
const STATUS = {reserved:"인수 대기", inUse:"이용 중", returned:"반납 완료"};

/* ---------- live state ---------- */
let db = null, user = null, assets = null;
let me = {id:null, name:"", avatarUrl:""}, canWrite = null;
let phase = "loading";            // loading | ready | slow | nodb
let sets = [], bookings = [], gotSets = false, gotBookings = false;
const profiles = {}, pendingProfiles = new Set(), photoUrl = {};
let ui = { tab:"explore", stack:[{view:"explore"}], cat:"all", sort:"dist", booking:null, armed:null, uploading:{}, form:null, formErr:"" };

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const won = n => (+n||0).toLocaleString("ko-KR")+"원";
const dist = m => m<1000 ? m+"m" : (m/1000).toFixed(1).replace(/\.0$/,"")+"km";
const DOW = "일월화수목금토";
const pad2 = n => String(n).padStart(2,"0");
const ymd = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return ymd(d); };
const fmt = s => { if(!s) return ""; const d = parse(s); return `${d.getMonth()+1}/${d.getDate()}(${DOW[d.getDay()]})`; };
const fmtTime = iso => { if(!iso) return ""; const d = new Date(iso); return `${d.getMonth()+1}/${d.getDate()} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const hash = s => { let h=0; for(const c of String(s)) h = (h*31 + c.charCodeAt(0)) >>> 0; return h; };
const setById = id => sets.find(s=>s.id===id);
const artKind = s => s.art || ARTOF[s.cat] || "tent";
const isWarm = s => typeof s.warm==="boolean" ? s.warm : hash(s.id)%2===1;
const slotsOf = s => { const sl = (s && Array.isArray(s.slots) ? s.slots : []).slice(0,4); while(sl.length<4) sl.push(PAD_SLOTS[sl.length]); return sl; };
const readonly = () => canWrite===false;

function personName(id){
  if(!id) return "이웃";
  const p = profiles[id];
  if(p && p.name) return p.name;
  if(id===me.id) return me.name || "나";
  return "이웃";
}
const ownerName = s => s.ownerLabel || (s.ownerId ? personName(s.ownerId) : "이웃");
const renterName = b => b.renterLabel || (b.renterId ? personName(b.renterId) : "이웃");
const isMine = s => !!(s.ownerId && me.id && s.ownerId===me.id);

function ensureProfiles(){
  if(!user) return;
  const ids = new Set();
  sets.forEach(s=>s.ownerId && ids.add(s.ownerId));
  bookings.forEach(b=>b.renterId && ids.add(b.renterId));
  const missing = [...ids].filter(i=>!(i in profiles) && !pendingProfiles.has(i)).slice(0,64);
  if(!missing.length) return;
  missing.forEach(i=>pendingProfiles.add(i));
  user.profiles(missing).then(ps=>{
    missing.forEach(i=>{ profiles[i] = (ps && ps[i]) || {name:""}; pendingProfiles.delete(i); });
    render();
  }).catch(()=>missing.forEach(i=>{ profiles[i] = {name:""}; pendingProfiles.delete(i); }));
}

function history(setId){
  return bookings.filter(b=>b.setId===setId && b.status==="returned").sort((a,b)=>(b.start||"").localeCompare(a.start||""));
}
function upcomingDates(){
  const out = [], t = new Date();
  for(let i=1; out.length<12 && i<40; i++){
    const d = new Date(t.getFullYear(), t.getMonth(), t.getDate()+i);
    if([5,6,0].includes(d.getDay())) out.push(ymd(d));
  }
  return out;
}
function nextDays(n){ const out=[], t=new Date(); for(let i=1;i<=n;i++) out.push(ymd(new Date(t.getFullYear(),t.getMonth(),t.getDate()+i))); return out; }
function isBlocked(set, date, exceptId){
  if(Array.isArray(set.blocked) && set.blocked.includes(date)) return "owner";
  const booked = bookings.some(b=>b.id!==exceptId && b.setId===set.id && ACTIVE(b) && date>=b.start && date<addDays(b.start,b.nights||1));
  return booked ? "booked" : false;
}

/* ---------- photos ---------- */
const sampleCache = {};
const PH = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 4 3'%3E%3Crect width='4' height='3' fill='%23889990'/%3E%3C/svg%3E";
function resolvePhoto(p){
  if(!p) return "";
  if(String(p).startsWith("data:")) return p;
  if(!String(p).startsWith("sample:")){ if(photoUrl[p]) return photoUrl[p]; loadPhoto(p); return PH; }
  if(sampleCache[p]) return sampleCache[p];
  const [, setId, stage, idx] = p.split(":");
  const set = setById(setId);
  const label = set ? slotsOf(set)[+idx] : "장비";
  const c = document.createElement("canvas"); c.width = 320; c.height = 240;
  const g = c.getContext("2d");
  const pal = set && isWarm(set) ? ["#C98A2E","#7A4F12"] : ["#3E7A5E","#173F2D"];
  const grad = g.createLinearGradient(0,0,0,240); grad.addColorStop(0,pal[0]); grad.addColorStop(1,pal[1]);
  g.fillStyle = grad; g.fillRect(0,0,320,240);
  g.fillStyle = "rgba(255,255,255,.08)"; g.fillRect(0,170,320,70);
  g.fillStyle = "rgba(255,255,255,.85)";
  g.beginPath(); g.moveTo(110,170); g.lineTo(160,92+(+idx||0)*6); g.lineTo(210,170); g.closePath(); g.fill();
  g.fillStyle = "rgba(0,0,0,.25)"; g.fillRect(150,140,20,30);
  g.fillStyle = "#fff"; g.font = "600 20px 'IBM Plex Sans KR', sans-serif"; g.fillText(label, 16, 34);
  g.font = "13px 'IBM Plex Sans KR', sans-serif"; g.fillStyle = "rgba(255,255,255,.8)";
  g.fillText(stage==="in" ? "인수 사진" : "반납 사진", 16, 56);
  g.fillText("샘플", 280, 228);
  return sampleCache[p] = c.toDataURL("image/jpeg", .8);
}
function toJpeg(file){
  return new Promise((res, rej)=>{
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = ()=>{
      const max = 1280, s = Math.min(1, max/Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b=> b ? res(b) : rej(new Error("encode")), "image/jpeg", .82);
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); rej(new Error("decode")); };
    img.src = url;
  });
}

/* ---------- writes ---------- */
async function write(fn){
  if(!db){ toast("저장소에 연결되지 않아 저장하지 못했어요."); return false; }
  for(let attempt=0; attempt<2; attempt++){
    try{ await fn(); return true; }
    catch(e){
      const c = e && e.code;
      if(c==="unavailable" && attempt===0){ await sleep(400+Math.random()*600); continue; }
      if(c==="invalid_argument" || c==="not_granted"){ canWrite = false; toast("이 링크에서는 보기만 할 수 있어요. 예약하려면 편집 권한이 필요해요."); render(); return false; }
      if(c==="quota_exceeded"){ toast("저장 공간이 가득 찼어요. 오래된 기록을 지운 뒤 다시 해 주세요."); return false; }
      if(c==="revoked"){ toast("접근 권한이 바뀌어 더 이상 저장할 수 없어요."); return false; }
      toast("저장하지 못했어요. 잠시 후 다시 시도해 주세요."); return false;
    }
  }
  return false;
}

function slotGrid(r, stage, editable){
  const s = setById(r.setId), labels = slotsOf(s), arr = (stage==="in" ? r.checkin : r.checkout) || [];
  return `<div class="slots">${labels.map((label,i)=>{
    const p = arr[i], key = stage+"-"+i;
    if(p) return `<div class="slot filled"><img src="${esc(resolvePhoto(p))}" alt="${esc(label)} ${stage==="in"?"인수":"반납"} 사진" data-act="zoom" data-bid="${esc(r.id)}" data-stage="${stage}" data-i="${i}">
      <span class="cap">${esc(label)}</span>${editable?`<button class="x" data-act="clear" data-stage="${stage}" data-i="${i}" aria-label="${esc(label)} 사진 지우기">×</button>`:""}</div>`;
    if(ui.uploading[key]) return `<div class="slot"><div class="spin"></div><span>올리는 중</span></div>`;
    if(!editable) return `<div class="slot"><span>${esc(label)}</span><span class="fine">사진 없음</span></div>`;
    if(!assets) return `<div class="slot"><span>${esc(label)}</span><span class="fine">사진 올리기는 편집 권한이 필요해요</span></div>`;
    return `<label class="slot" for="f-${key}">${I.cam}<span>${esc(label)}</span>
      <input type="file" id="f-${key}" accept="image/*" capture="environment" data-stage="${stage}" data-i="${i}" hidden></label>`;
  }).join("")}</div>`;
}

function vTrip({id}){
  const r = bookings.find(x=>x.id===id); if(!r) return gone();
  const s = setById(r.setId) || {id:r.setId, name:"삭제된 세트", slots:[]};
  const mineTrip = me.id && r.renterId===me.id;
  const ed = mineTrip && !readonly();
  const nIn = (r.checkin||[]).filter(Boolean).length, nOut = (r.checkout||[]).filter(Boolean).length;
  const k = ["reserved","inUse","returned"].indexOf(r.status);
  const steps = [["예약 확정",true],["인수",k>=1],["이용",k>=1],["반납",k>=2]];
  let body = "", cta = "";
  if(r.status==="reserved"){
    body = `<section class="sec">
      <h2 class="h-sec">인수 전 사진 <small>${nIn}/4</small></h2>
      <p class="fine">장비를 받을 때 칸마다 한 장씩 찍어 주세요.</p>

    cta = ed ? `<button class="btn" data-act="finish-in" ${nIn===4?"":"disabled"}>${nIn===4?"인수 완료":`인수 사진 ${4-nIn}장 남음`}</button>` : "";
  } else if(r.status==="inUse"){
    body = `<section class="sec">
      <h2 class="h-sec">인수 전 사진 <small>${fmtTime(r.checkinAt)} 저장</small></h2>
      ${slotGrid(r,"in",false)}
    </section>
    <section class="sec">
      <h2 class="h-sec">반납 후 사진 <small>${nOut}/4</small></h2>
      <p class="fine">인수 사진과 같은 구도로 찍어 주세요.</p>
      ${slotGrid(r,"out",ed)}
    </section>`;
    cta = ed ? `<button class="btn" data-act="finish-out" ${nOut===4?"":"disabled"}>${nOut===4?"반납 완료":`반납 사진 ${4-nOut}장 남음`}</button>` : "";
  } else {
    const L = slotsOf(s);
    body = `<section class="sec">
      <h2 class="h-sec">인수·반납 비교</h2>
      <div class="compare">
        <span></span><span class="hd">인수 <span class="num">${fmtTime(r.checkinAt)}</span></span><span class="hd">반납 <span class="num">${fmtTime(r.checkoutAt)}</span></span>
        ${L.map((l,i)=>`<span class="lab">${esc(l)}</span>
          <button class="thumb" data-act="zoom" data-bid="${esc(r.id)}" data-stage="in" data-i="${i}"><img src="${esc(resolvePhoto((r.checkin||[])[i]))}" alt="${esc(l)} 인수 사진"></button>
          <button class="thumb" data-act="zoom" data-bid="${esc(r.id)}" data-stage="out" data-i="${i}"><img src="${esc(resolvePhoto((r.checkout||[])[i]))}" alt="${esc(l)} 반납 사진"></button>`).join("")}
      </div>
      
    </section>`;
    cta = setById(r.setId) ? `<button class="btn" data-act="open-history" data-id="${esc(r.setId)}">장비 이력서 보기</button>` : "";
  }
  return `<div class="pad">
    <section class="stack">
      <div class="row" style="flex-wrap:nowrap"><h1 class="h-display" style="font-size:24px;min-width:0">${esc(s.name)}</h1><span class="pill ${r.status}">${STATUS[r.status]||""}</span></div>

    ${!mineTrip && r.status!=="returned"?`<p class="note">대여자가 직접 사진을 올리고 인수·반납을 완료해요. 이 화면은 실시간으로 갱신돼요.</p>`:""}
    ${body}
  </div>
  ${cta?`<div class="ctabar">${cta}</div>`:""}`;

function renderGuide(){
  const c = cur();
  const active = bookings.filter(b=>me.id && b.renterId===me.id).sort((a,b)=>(b.createdAt||"").localeCompare(a.createdAt||""))[0];
  let step = 1;
  if(c.view==="detail" || c.view==="book") step = 2;
  else if(c.view==="done") step = 3;
  else if(c.view==="trip"){ const r = bookings.find(x=>x.id===c.id); step = !r||r.status==="reserved"?3:r.status==="inUse"?4:5; }
  else if(c.view==="trips" && active) step = active.status==="reserved"?3:active.status==="inUse"?4:5;
  else if(c.view==="history" || c.view==="historyDetail") step = 5;
  const G = [["탐색","근처 첫 캠핑 세트 찾기","기능 1"],["선택","날짜·코칭 옵션 고르고 예약","기능 2"],["인수","이웃에게 받으며 사진 4장","기능 3"],["이용","캠핑장에서 사용 (앱 밖)","인수 완료 후"],["반납","사진 4장 찍고 이력 갱신","기능 3·4"]];
  $("#gsteps").innerHTML = G.map(([t,d,f],i)=>`<li class="${i+1===step?"on":i+1<step?"past":""}"><span class="n">${"①②③④⑤"[i]}</span><span><b>${t}</b> <small>${d} · ${f}</small></span></li>`).join("");
}

  ui.busy = true; render();
  try{
    const holder = me.id || ("tab-"+Math.random().toString(36).slice(2));
    let lk = {acquired:true};
    try{ lk = await db.doc("locks/"+s.id).acquire({holder, ttlMs:8000}); }catch(e){ /* lease is best-effort */ }
    if(!lk.acquired){ toast("다른 사람이 같은 세트를 예약하는 중이에요. 잠시 후 다시 눌러 주세요."); return; }
    const end = addDays(b.date, b.nights);
    let conflict = false;
    try{
      const snap = await db.collection("bookings").where("setId","==",s.id).get();
      conflict = snap.docs.some(d=>{ const x = d.data(); return ACTIVE(x) && b.date < addDays(x.start, x.nights||1) && x.start < end; });
    }catch(e){ conflict = false; }
    for(let i=0;i<b.nights;i++) if((s.blocked||[]).includes(addDays(b.date,i))) conflict = true;
    if(conflict){ toast("그 사이에 다른 예약이 들어왔어요. 다른 날을 골라 주세요."); b.date = null; return; }
    const coaching = !!(s.coaching && b.coaching);
    const ref = db.collection("bookings").doc();
    const data = {setId:s.id, renterId:me.id, start:b.date, nights:b.nights, coaching,
      total:(s.price||0)*b.nights + (coaching?COACH_FEE:0), status:"reserved", createdAt:new Date().toISOString(),
      checkin:[null,null,null,null], checkout:[null,null,null,null]};
    const ok = await write(()=>ref.set(data));
    if(ok){ ui.tab = "trips"; ui.stack = [{view:"trips"},{view:"done", bid:ref.id}]; ui.busy = false; render(true); return; }
  } finally { ui.busy = false; render(); }
}

async function setPhoto(stage, i, value){
  const r = curBooking(); if(!r) return false;
  const field = stage==="in" ? "checkin" : "checkout";
  const arr = (r[field]||[null,null,null,null]).slice(); while(arr.length<4) arr.push(null);
  arr[i] = value;
  return write(()=>bRef(r.id).update({[field]:arr}));
}

async function submitForm(){
  const f = ui.form, c = cur();
  const price = parseInt(String(f.price).replace(/[^0-9]/g,""),10);
  const items = f.items.map(i=>({n:i.n.trim(), c:i.c.trim()})).filter(i=>i.n);
  if(!String(f.owner||"").trim()) ui.formErr = "보유자 표시 이름을 적어 주세요.";
  else if(!f.name.trim()) ui.formErr = "세트 이름을 적어 주세요.";
  else if(!(price>=1000 && price<=300000)) ui.formErr = "1박 대여료는 1,000원에서 300,000원 사이로 적어 주세요.";
  else if(items.length<2) ui.formErr = "구성 장비를 2개 이상 적어 주세요.";
  else ui.formErr = "";
  if(ui.formErr){ render(); return; }
  const data = {name:f.name.trim(), cat:f.cat, price, dist:+f.dist, place:f.place.trim(), coaching:!!f.coaching, desc:f.desc.trim(),
    items, slots:items.slice(0,4).map(i=>i.n), ownerId:me.id, ownerLabel:String(f.owner).trim()};
  me.name = data.ownerLabel; try{ localStorage.setItem(NAME_KEY, me.name); }catch(e){}
  ui.busy = true; render();
  let ok, newId = c.id;
  if(c.id){ ok = await write(()=>db.doc("sets/"+c.id).update(data)); }
  else { const ref = db.collection("sets").doc(); newId = ref.id; ok = await write(()=>ref.set(Object.assign(data,{blocked:[], createdAt:new Date().toISOString()}))); }
  ui.busy = false;
  if(ok){ ui.form = null; ui.tab = "mine"; ui.stack = [{view:"mine"},{view:"owner", id:newId}]; render(true); toast(c.id?"세트 정보를 고쳤어요.":"장비를 등록했어요. 이제 이웃이 예약할 수 있어요."); }
  else render();
}

document.addEventListener("click", async e=>{
  const el = e.target.closest("[data-act]");
  if(!el){ if(e.target.id==="lightbox") $("#lightbox").hidden = true; return; }
  const a = el.dataset.act, c = cur();
  if(a!=="cancel" && a!=="del-set" && a!=="reset" && ui.armed){ if(ui.armed==="reset") document.querySelectorAll("[data-act=reset]").forEach(b=>{ b.textContent = "시연 데이터 초기화"; b.classList.remove("danger"); }); ui.armed = null; }
  switch(a){
    case "tab": tab(el.dataset.v); break;
    case "back": back(); break;
    case "cat": ui.cat = el.dataset.v; render(); break;
    case "sort": ui.sort = el.dataset.v; render(); break;
    case "open-set": go("detail",{id:el.dataset.id}); break;
    case "open-owner": ui.tab = "mine"; go("owner",{id:el.dataset.id}); break;
    case "book": {
      const s = setById(el.dataset.id);
      ui.booking = {date: upcomingDates().find(d=>!isBlocked(s,d)) || null, nights:1, coaching:false};
      go("book",{id:s.id}); break;
    }
    case "date": ui.booking.date = el.dataset.v; render(); break;
    case "nights": ui.booking.nights = +el.dataset.v; render(); break;
    case "coach": ui.booking.coaching = el.dataset.v==="1"; render(); break;
    case "confirm-book": confirmBook(el.dataset.id); break;
    case "open-trip": if(c.view==="done"){ ui.stack = [{view:"trips"}]; ui.tab = "trips"; } go("trip",{id:el.dataset.id}); break;
    case "open-history": go("historyDetail",{id:el.dataset.id}); break;
    case "sample": {
      const r = curBooking(); if(!r) break;
      const st = el.dataset.stage, field = st==="in"?"checkin":"checkout";
      const arr = (r[field]||[]).slice(); while(arr.length<4) arr.push(null);
      for(let i=0;i<4;i++) if(!arr[i]) arr[i] = `sample:${r.setId}:${st}:${i}`;
      await write(()=>bRef(r.id).update({[field]:arr})); break;
    }
    case "clear": {
      const r = curBooking(); if(!r) break;
      const arr = (el.dataset.stage==="in"?r.checkin:r.checkout)||[], old = arr[+el.dataset.i];
      if(await setPhoto(el.dataset.stage, +el.dataset.i, null) && assets && old && !String(old).startsWith("sample:")) assets.delete(old).catch(()=>{});
      break;
    }
    case "finish-in": {
      const r = curBooking(); if(!r) break;
      if(await write(()=>bRef(r.id).update({status:"inUse", checkinAt:new Date().toISOString()}))) { $("#view").scrollTop = 0; toast("인수 사진 4장을 저장했어요. 즐거운 캠핑 되세요!"); }
      break;
    }
    case "finish-out": {
      const r = curBooking(); if(!r) break;
      if(await write(()=>bRef(r.id).update({status:"returned", checkoutAt:new Date().toISOString(), note:"반납 확인 완료 · 이상 없음"}))) { $("#view").scrollTop = 0; toast("반납을 기록했어요. 장비 이력서에 추가됐어요."); }
      break;
    }
    case "cancel": {
      if(ui.armed!=="cancel"){ ui.armed = "cancel"; render(); break; }
      ui.armed = null;
      const r = curBooking(); if(!r) break;
      const photos = [...(r.checkin||[]), ...(r.checkout||[])].filter(p=>p && !String(p).startsWith("sample:"));
      if(await write(()=>bRef(r.id).delete())){
        if(assets) photos.forEach(p=>assets.delete(p).catch(()=>{}));
        ui.stack = [{view:"trips"}]; ui.tab = "trips"; render(true); toast("예약을 취소했어요.");
      }
      break;
    }
    case "toggle-off": {
      const s = setById(c.id); if(!s) break;
      const d = el.dataset.v, cur2 = new Set(s.blocked||[]);
      cur2.has(d) ? cur2.delete(d) : cur2.add(d);
      const today = ymd(new Date());
      await write(()=>db.doc("sets/"+s.id).update({blocked:[...cur2].filter(x=>x>=today).sort()}));
      break;
    }
    case "register": ui.form = blankForm(); ui.formErr = ""; go("register",{}); break;
    case "edit-set": {
      const s = setById(el.dataset.id); if(!s) break;
      const items = (s.items||[]).map(i=>({n:i.n||"", c:i.c||""})); while(items.length<4) items.push({n:"",c:"상태 좋음"});
      ui.form = {owner:s.ownerLabel||me.name||"", name:s.name||"", cat:s.cat||"camp", price:String(s.price||""), dist:String(s.dist||800), place:s.place||"", coaching:!!s.coaching, desc:s.desc||"", items:items.slice(0,4)};
      ui.formErr = ""; go("register",{id:s.id}); break;
    }
    case "del-set": {
      if(ui.armed!=="del-set"){ ui.armed = "del-set"; render(); break; }
      ui.armed = null;
      if(await write(()=>db.doc("sets/"+el.dataset.id).delete())){ ui.stack = [{view:"mine"}]; render(true); toast("세트를 삭제했어요."); }
      break;
    }
    case "zoom": {
      const r = bookings.find(x=>x.id===el.dataset.bid); if(!r) break;
      const s = setById(r.setId), i = +el.dataset.i, st = el.dataset.stage;
      const p = ((st==="in"?r.checkin:r.checkout)||[])[i]; if(!p) break;
      zoom(resolvePhoto(p), `${fmt(r.start)} · ${slotsOf(s)[i]} · ${st==="in"?"인수":"반납"} 사진`); break;
    }
    case "close-lb": $("#lightbox").hidden = true; break;
    case "reset": {
      if(ui.armed!=="reset"){ ui.armed = "reset"; document.querySelectorAll("[data-act=reset]").forEach(b=>{ b.textContent = "한 번 더 누르면 처음 상태로 돌아가요"; b.classList.add("danger"); }); break; }
      ui.armed = null; db.reset(); idb.clear().catch(()=>{});
      Object.keys(photoUrl).forEach(k=>delete photoUrl[k]); Object.keys(photoLoading).forEach(k=>delete photoLoading[k]);
      ui.tab = "explore"; ui.stack = [{view:"explore"}]; ui.booking = null; ui.form = null;
      document.querySelectorAll("[data-act=reset]").forEach(b=>{ b.textContent = "시연 데이터 초기화"; b.classList.remove("danger"); });
      render(true); toast("처음 상태로 되돌렸어요."); break;
    }
  }
});

document.addEventListener("input", e=>{
  const k = e.target.dataset && e.target.dataset.f; if(!k || !ui.form) return;
  const v = e.target.type==="checkbox" ? e.target.checked : e.target.value;
  const m = k.match(/^i(\d)([nc])$/);
  if(m) ui.form.items[+m[1]][m[2]] = v; else ui.form[k] = v;
});
document.addEventListener("submit", e=>{ if(e.target.id==="regform"){ e.preventDefault(); if(!ui.busy) submitForm(); } });

document.addEventListener("change", async e=>{
  const inp = e.target;
  if(inp.dataset && inp.dataset.f){ // selects & checkbox fire change, mirror into form
    if(ui.form){ const k = inp.dataset.f; ui.form[k] = inp.type==="checkbox" ? inp.checked : inp.value; }
    return;
  }
  if(!(inp instanceof HTMLInputElement) || inp.type!=="file" || !inp.files || !inp.files[0] || !assets) return;
  const stage = inp.dataset.stage, i = +inp.dataset.i, key = stage+"-"+i, file = inp.files[0];
  ui.uploading[key] = true; render();
  try{
    const blob = await toJpeg(file);
    const res = await assets.upload(blob, {type:"image/jpeg"});
    photoUrl[res.id] = res.url;
    await setPhoto(stage, i, res.id);
  }catch(err){
    const c = err && err.code;
    toast(c==="too_large" ? "사진이 너무 커요. 더 작은 사진으로 골라 주세요."
      : c==="not_granted" ? "사진을 올릴 권한이 없어요. 편집 권한이 필요해요."
      : c==="quota_exceeded" ? "사진 저장 공간이 가득 찼어요."
      : (err && (err.message==="decode"||err.message==="encode")) ? "이 사진 형식은 열 수 없어요. JPG나 PNG 사진으로 다시 골라 주세요."
      : "사진을 올리지 못했어요. 잠시 후 다시 시도해 주세요.");
  }finally{ delete ui.uploading[key]; render(); }
});

const LS_KEY = "jumal-sachang-v1", NAME_KEY = "jumal-sachang-name";
function seedDocs(){ return JSON.parse(JSON.stringify(SEED)); }
function makeLocalDb(){
  let docs = null;
  try{ const raw = JSON.parse(localStorage.getItem(LS_KEY)); if(raw && raw.docs) docs = raw.docs; }catch(e){}
  if(!docs) docs = seedDocs();
  const subs = [];
  const fire = () => subs.forEach(f=>f());
  const commit = (mutate) => {
    const prev = JSON.stringify(docs);
    mutate();
    try{ localStorage.setItem(LS_KEY, JSON.stringify({docs})); }
    catch(e){ if(e && e.name==="QuotaExceededError"){ docs = JSON.parse(prev); throw {code:"quota_exceeded"}; } }
    fire();
  };
  const parent = k => k.slice(0, k.lastIndexOf("/")), leaf = k => k.slice(k.lastIndexOf("/")+1);
  const snapOf = (col, f) => {
    const list = Object.keys(docs).filter(k=>parent(k)===col).map(k=>{ const v = docs[k]; return {id:leaf(k), exists:true, data:()=>v, metadata:{fromCache:false}}; })
      .filter(d=>f.every(([a,v])=>d.data()[a]===v));
    return {docs:list, size:list.length, empty:!list.length, metadata:{fromCache:false, hasPendingWrites:false}, docChanges:()=>[]};
  };
  const docRef = path => ({ id:leaf(path), path,
    get: async()=>({exists: path in docs, data:()=>docs[path]}),
    set: async d=>commit(()=>{ docs[path] = JSON.parse(JSON.stringify(d)); }),
    update: async d=>{ if(!(path in docs)) throw {code:"unavailable"}; commit(()=>{ Object.assign(docs[path], JSON.parse(JSON.stringify(d))); }); },
    delete: async()=>commit(()=>{ delete docs[path]; }),
    acquire: async()=>({acquired:true}) });
  const q = (col, f=[]) => ({
    where:(a,op,v)=>q(col,[...f,[a,v]]),
    get: async()=>snapOf(col,f),
    onSnapshot:(next)=>{ const fn = ()=>next(snapOf(col,f)); subs.push(fn); setTimeout(fn,0); return ()=>{ const i = subs.indexOf(fn); if(i>=0) subs.splice(i,1); }; },
    doc: id=>docRef(col+"/"+(id || ("x"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)))) });
  window.addEventListener("storage", e=>{ if(e.key===LS_KEY){ try{ const raw = JSON.parse(e.newValue); docs = raw && raw.docs ? raw.docs : seedDocs(); }catch(err){} fire(); } });
  return { doc:docRef, collection:c=>q(c), reset(){ commit(()=>{ docs = seedDocs(); }); } };
}
const idb = (()=>{
  let p;
  const open = () => p || (p = new Promise((res,rej)=>{ const r = indexedDB.open("jumal-sachang-photos",1); r.onupgradeneeded = ()=>r.result.createObjectStore("p"); r.onsuccess = ()=>res(r.result); r.onerror = ()=>rej(r.error); }));
  const tx = (mode, fn) => open().then(d=>new Promise((res,rej)=>{ const t = d.transaction("p",mode); const req = fn(t.objectStore("p")); t.oncomplete = ()=>res(req && req.result); t.onerror = ()=>rej(t.error); t.onabort = ()=>rej(t.error); }));
  return { put:(k,v)=>tx("readwrite",s=>s.put(v,k)), get:k=>tx("readonly",s=>s.get(k)), del:k=>tx("readwrite",s=>s.delete(k)), clear:()=>tx("readwrite",s=>s.clear()) };
})();
const blobToDataUrl = b => new Promise((res,rej)=>{ const r = new FileReader(); r.onload = ()=>res(r.result); r.onerror = rej; r.readAsDataURL(b); });
